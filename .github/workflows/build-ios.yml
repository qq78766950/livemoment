name: 构建未签名 IPA

# 手动触发，或推到 main 时自动跑。
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 允许失败时把日志提交回仓库
permissions:
  contents: write

jobs:
  build:
    name: 云端编译（macOS runner）
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          sw_vers
          echo "---"
          xcode-select -p
          xcodebuild -version

      # 主路径：直接编译仓库里的 LiveMoment.xcodeproj
      - name: 编译并打包 IPA
        id: direct
        continue-on-error: true
        run: |
          bash scripts/build_ipa.sh
          ls -la build/*.ipa

      # 兜底：如果仓库里这份 pbxproj 在 runner 的 Xcode 上打不开（工程格式版本不兼容），
      # 就用 XcodeGen 从 project.yml 重新生成一份再编。
      - name: 兜底编译（XcodeGen 重新生成工程）
        id: fallback
        if: steps.direct.outcome == 'failure'
        continue-on-error: true
        run: |
          brew install xcodegen
          rm -rf LiveMoment.xcodeproj
          xcodegen generate
          bash scripts/build_ipa.sh
          ls -la build/*.ipa

      - name: 编译日志（失败时留档）
        if: failure()
        run: |
          echo "===== xcodebuild.log 末尾 200 行 ====="
          tail -n 200 build/xcodebuild.log || true

      - name: 上传 IPA
        if: steps.direct.outcome == 'success' || steps.fallback.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LiveMoment-unsigned-ipa
          path: build/*.ipa
          retention-days: 30

      # 日志下载需要凭据，所以失败时直接把日志提交回仓库，
      # 这样不登录也能通过 raw.githubusercontent.com 读到。
      # [skip ci] 防止这次 push 再触发新一轮构建造成死循环。
      - name: 把编译日志提交回仓库
        if: always()
        run: |
          if [ -f build/xcodebuild.log ]; then
            tail -n 600 build/xcodebuild.log > build-error.log
          else
            {
              echo "build/xcodebuild.log 不存在，build 目录内容："
              ls -la build 2>&1 || true
              echo "--- 工作目录 ---"
              ls -la
            } > build-error.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.log
          if git diff --cached --quiet; then
            echo "日志没有变化，跳过提交"
          else
            git commit -q -m "CI: 提交编译日志供诊断 [skip ci]"
            git push
            echo "已提交日志"
          fi

      - name: 两次都没编过就报错退出
        if: steps.direct.outcome == 'failure' && steps.fallback.outcome == 'failure'
        run: |
          echo "::error::两次编译都失败了，完整日志见仓库根目录 build-error.log"
          exit 1
