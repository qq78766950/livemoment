name: 构建未签名 IPA

# 手动触发，或推到 main 时自动跑。
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 允许把日志 / ipa 提交回仓库
permissions:
  contents: write

jobs:
  build:
    name: 云端编译（macOS runner）
    runs-on: macos-15
    timeout-minutes: 45

    env:
      BOT_NAME: "github-actions[bot]"
      BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          sw_vers
          echo "---"
          xcode-select -p
          xcodebuild -version

      # 主路径：直接编译仓库里的 LiveMoment.xcodeproj
      - name: 编译并打包 IPA
        id: direct
        continue-on-error: true
        run: |
          bash scripts/build_ipa.sh
          ls -la build/*.ipa

      # 兜底：如果仓库里这份 pbxproj 在 runner 的 Xcode 上打不开（工程格式版本不兼容），
      # 就用 XcodeGen 从 project.yml 重新生成一份再编。
      - name: 兜底编译（XcodeGen 重新生成工程）
        id: fallback
        if: steps.direct.outcome == 'failure'
        continue-on-error: true
        run: |
          brew install xcodegen
          rm -rf LiveMoment.xcodeproj
          xcodegen generate
          bash scripts/build_ipa.sh
          ls -la build/*.ipa

      - name: 编译日志（失败时留档）
        if: failure()
        run: |
          echo "===== xcodebuild.log 末尾 200 行 ====="
          tail -n 200 build/xcodebuild.log || true

      - name: 上传 IPA 为构建产物
        if: steps.direct.outcome == 'success' || steps.fallback.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LiveMoment-unsigned-ipa
          path: build/*.ipa
          retention-days: 30

      # 把 ipa 直接放进仓库，手机上不好操作的话点一下就能下载，
      # 不用去 Actions 页面下 zip 再解压。[skip ci] 防止递归触发构建。
      - name: 发布 IPA 到 dist/
        if: steps.direct.outcome == 'success' || steps.fallback.outcome == 'success'
        run: |
          mkdir -p dist
          cp build/*.ipa dist/livemoment-unsigned.ipa
          ls -la dist/
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -f dist/livemoment-unsigned.ipa
          if git diff --cached --quiet; then
            echo "ipa 没有变化，跳过提交"
          else
            git commit -q -m "CI: 发布未签名 ipa 到 dist/ [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "已发布"
          fi

      # 日志下载需要凭据，所以失败时把日志提交回仓库，
      # 这样不登录也能通过 raw.githubusercontent.com 读到。
      - name: 把编译日志提交回仓库
        if: steps.direct.outcome == 'failure' && steps.fallback.outcome == 'failure'
        run: |
          if [ -f build/xcodebuild.log ]; then
            tail -n 600 build/xcodebuild.log > build-error.log
          else
            {
              echo "build/xcodebuild.log 不存在，build 目录内容："
              ls -la build 2>&1 || true
            } > build-error.log
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add build-error.log
          if git diff --cached --quiet; then
            echo "日志没有变化，跳过提交"
          else
            git commit -q -m "CI: 提交编译日志供诊断 [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: 两次都没编过就报错退出
        if: steps.direct.outcome == 'failure' && steps.fallback.outcome == 'failure'
        run: |
          echo "::error::两次编译都失败了，完整日志见仓库根目录 build-error.log"
          exit 1
